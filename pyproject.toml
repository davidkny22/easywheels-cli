[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easywheels"
version = "0.1.0"
description = "Smart GPU wheel installer. Auto-detects CUDA, GPU, torch, and Python to install the right pre-built wheel."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "EasyWheels", email = "hello@easywheels.io" }]
keywords = ["cuda", "gpu", "wheels", "pip", "pytorch", "flash-attention", "nvidia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://easywheels.io"
Repository = "https://github.com/davidkny20/easywheels-cli"
Documentation = "https://easywheels.io/packages"
Issues = "https://github.com/davidkny20/easywheels-cli/issues"

[project.scripts]
easywheels = "easywheels_cli.main:app"
ew = "easywheels_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["easywheels_cli"]
