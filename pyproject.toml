[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easywheels-cli"
version = "0.1.0"
description = "Smart GPU wheel installer — auto-detects CUDA, GPU, torch, and Python to install the right wheel."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "EasyWheels", email = "hello@easywheels.io" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
easywheels = "easywheels_cli.main:app"
ew = "easywheels_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["easywheels_cli"]
